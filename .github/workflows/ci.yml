name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment variables
        run: npm run validate:env
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/skype-clone-test
          JWT_SECRET: test-jwt-secret-for-ci-validation-only-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-validation-only-32-chars
          STRIPE_SECRET_KEY: sk_test_ci_validation_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_ci_validation_placeholder

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run build

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: mongosh --eval "db = db.getSiblingDB('skype_clone_test'); db.createCollection('users');"

      - name: Run backend tests
        run: cd packages/backend && npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/skype_clone_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-testing-purposes-only-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-testing-purposes-only-32-chars
          STRIPE_SECRET_KEY: sk_test_ci_testing_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_ci_testing_placeholder

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          directory: ./packages/backend/coverage
          flags: backend

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: cd packages/web && npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          directory: ./packages/web/coverage
          flags: web

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level high

      - name: Run security scan with Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [validate, test-backend, test-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            skype-clone-backend:${{ github.sha }}
            skype-clone-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.web
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            skype-clone-web:${{ github.sha }}
            skype-clone-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to staging server
        run: |
          echo "🚀 Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: ssh, docker-compose pull, docker-compose up, etc.
          echo "✅ Staging deployment completed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to production server
        run: |
          echo "🚀 Deploying to production environment..."
          # Add your production deployment commands here
          # Example: blue-green deployment, rolling updates, etc.
          echo "✅ Production deployment completed"
